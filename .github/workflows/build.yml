name: Velocity-CTD CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        ctd: [410, 411]
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - name: Set up JDK 25
        uses: actions/setup-java@v4.7.0
        with:
          distribution: temurin
          java-version: 25
      - name: Checkout paired LimboAPI source
        uses: actions/checkout@v4.2.2
        with:
          repository: tommasobenatti/LimboAPI
          ref: 7470c09edfb781cc8c864895b76ecc27f39e8b08
          path: build/limboapi-source
      - name: Download verified Velocity-CTD
        env:
          CTD_BUILD: ${{ matrix.ctd }}
        run: |
          case "$CTD_BUILD" in
            410) checksum=7ec86cab7c4187e84ff0312ef2459bd70f96c5484552142b79b82d7c9d25a05d ;;
            411) checksum=c772d49f3b4d77244ffa028603380d327d6b992e5867c57bde9492da5d1c3f25 ;;
            *) exit 1 ;;
          esac
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/velocity-ctd.jar" "https://github.com/GemstoneGG/Velocity-CTD/releases/download/build-$CTD_BUILD/velocity-ctd-fatjar-4.3.1-SNAPSHOT-$CTD_BUILD.jar"
          echo "$checksum  $RUNNER_TEMP/velocity-ctd.jar" | sha256sum --check
      - name: Build paired API
        run: |
          build/limboapi-source/gradlew --project-dir build/limboapi-source --no-daemon :api:jar "-PvelocityCtdJar=$RUNNER_TEMP/velocity-ctd.jar"
          cp build/limboapi-source/api/build/libs/api-1.1.27-MCExp-CTD410.1.jar "$RUNNER_TEMP/limboapi-api.jar"
      - name: Build and verify
        run: ./gradlew --no-daemon build "-PvelocityCtdJar=$RUNNER_TEMP/velocity-ctd.jar" "-PlimboApiJar=$RUNNER_TEMP/limboapi-api.jar"
      - name: Upload jar and test evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: LimboReconnect-CTD${{ matrix.ctd }}-${{ github.sha }}
          if-no-files-found: warn
          path: |
            build/libs/LimboReconnect-*-MCExp-CTD410*.jar
            build/test-results/test/TEST-*.xml
            build/reports/checkstyle/*.xml
