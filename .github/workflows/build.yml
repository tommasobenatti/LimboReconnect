name: Velocity-CTD CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - name: Set up JDK 25
        uses: actions/setup-java@v4.7.0
        with:
          distribution: temurin
          java-version: 25
      - name: Download verified Velocity-CTD 410
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/velocity-ctd.jar" https://github.com/GemstoneGG/Velocity-CTD/releases/download/build-410/velocity-ctd-fatjar-4.3.1-SNAPSHOT-410.jar
          echo "7ec86cab7c4187e84ff0312ef2459bd70f96c5484552142b79b82d7c9d25a05d  $RUNNER_TEMP/velocity-ctd.jar" | sha256sum --check
      - name: Build and verify
        run: ./gradlew --no-daemon build "-PvelocityCtdJar=$RUNNER_TEMP/velocity-ctd.jar"
      - name: Upload jar and test evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: LimboReconnect-CTD410-${{ github.sha }}
          if-no-files-found: warn
          path: |
            build/libs/LimboReconnect-*-MCExp-CTD410.jar
            build/test-results/test/TEST-*.xml
            build/reports/checkstyle/*.xml
